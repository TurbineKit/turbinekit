# Local Postgres for development: `docker compose up -d`.
# No Docker? `pnpm db:local` runs PGlite as a Postgres server instead.
# Both match the DATABASE_URL in .env.example.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql

volumes:
  postgres:
